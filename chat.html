<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>AI 聊天室 - 偶像角色版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <h2>💬 偶像 AI 聊天室</h2>

    <p>選擇你想聊天的偶像：</p>

    <select id="personality">
      <option value="genki">🅰 P醬</option>
      <option value="onepiece">🅱 C醬</option>
      <option value="bluearchive">🅲 M啾</option>
    </select>

    <div id="chat-box"></div>

    <div class="input-area">
      <input id="user-input" type="text" placeholder="輸入訊息…" />
      <button onclick="sendMessage()">送出</button>
    </div>

    <br>
    <a href="index.html">⬅ 回首頁</a>
  </div>

  <script src="script.js"></script>
</body>
</html>
